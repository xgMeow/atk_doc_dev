stages:
  - build
  - deploy
  - sync


build:gitlab:
  stage: build  
  tags:
    - npm
    - windows
  artifacts:
    paths:
    - .dist/gitlab
  script:
    - Copy-Item -Path F:\jk\atk-doc\node_modules -Destination $PWD -Recurse
    - npm run build:gitlab

build:standalone:
  stage: build  
  tags:
    - npm
    - windows
  artifacts:
    paths:
    - .dist/standalone
  script:
    - Copy-Item -Path F:\jk\atk-doc\node_modules -Destination $PWD -Recurse
    - npm run build:standalone

build:standalone-kylin:
  stage: build  
  tags:
    - npm
    - windows
  artifacts:
    paths:
    - .dist/standalone-kylin
  script:
    - Copy-Item -Path F:\jk\atk-doc\node_modules -Destination $PWD -Recurse
    - npm run build:standalone-kylin


.deploy:pages-old:
  stage: deploy
  tags:
    - linux
    - gitlab  
  
  dependencies:
    - build:gitlab
    - build:standalone
  script:
    - cp -r .dist/gitlab/* /mnt/project/gitlab/gitlab-rails/shared/pages/jinke18/atk-doc
    - zip -r /mnt/project/gitlab/gitlab-rails/shared/pages/jinke18/atk-doc/help-standalone.zip .dist/standalone/


deploy:pages:
  stage: deploy
  tags:
    - linux
    - gitlab

  dependencies:
    - build:gitlab
    - build:standalone
    - build:standalone-kylin
  script:
    - sudo cp  -rv .dist/gitlab/* /var/opt/gitlab/gitlab-rails/shared/pages
    - sudo zip -rv /var/opt/gitlab/gitlab-rails/shared/pages/help-standalone.zip        .dist/standalone/
    - sudo zip -rv /var/opt/gitlab/gitlab-rails/shared/pages/help-standalone-kylin.zip  .dist/standalone-kylin/


# 同步到 GitHub Pages
sync:github:
  stage: sync
  only:
    - master
    - develop
  tags:
    - linux
    - gitlab
  script:
    - git config user.name "GitCode CI"
    - git config user.email "ci@gitcode.com"
    - |
      if [ "$CI_COMMIT_REF_NAME" = "master" ]; then
        echo "Syncing master to GitHub atk_doc..."
        git push https://xg_meow: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@github.com/xgMeow/atk_doc.git master:main -f
        echo "Sync master completed!"
      fi
    - |
      if [ "$CI_COMMIT_REF_NAME" = "develop" ]; then
        echo "Syncing develop to GitHub atk_doc_dev..."
        git push https://xg_meow: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@github.com/xgMeow/atk_doc_dev.git develop:main -f
        echo "Sync develop completed!"
      fi
