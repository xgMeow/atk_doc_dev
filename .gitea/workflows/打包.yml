name: 构建并部署文档站

on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: docs-server
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: https://gitlink.org.cn/actions/checkout@v4

      - name: Setup Node.js
        uses: https://gitlink.org.cn/actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:online
        env:
          # gitlink 站点挂在独立域名的根路径下，覆盖 GitHub Pages 的 /<repo>/ 规则
          SITE_BASE_ROOT: 'true'
      - name: 检查构建产物
        run: du -sh .dist/online && ls -lsh .dist/online
      - name: "远程文件拷贝[scp-2901445a]"
        uses: https://gitlink.org.cn/actions/scp-action@master
        with:
          host: '${{ secrets.DOCS_SERVER }}'
          port: '22'
          username: 'root'
          password: '${{ secrets.DOCS_SERVER_PWD }}'
          source: '.dist/online/*'
          target: '/root/atk-help/'
          overwrite: true
          strip_components: 2
          timeout: 120s
          command_timeout: 10m
      - name: "重启服务[ssh-66e2a]"
        uses: https://gitlink.org.cn/actions/ssh-action@v1.0.3
        with:
          host: '${{ secrets.DOCS_SERVER }}'
          port: '22'
          username: 'root'
          password: '${{ secrets.DOCS_SERVER_PWD }}'
          script: 'service nginx restart'
