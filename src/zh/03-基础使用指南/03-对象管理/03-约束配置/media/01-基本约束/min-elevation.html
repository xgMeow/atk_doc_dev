<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>最小俯仰角示意图</title>
  <!--
    本页没有读数 / 控制面板：所有数字与说明都画在 SVG 里，内嵌与独立打开完全一样，
    因此不需要按 window.self !== window.top 区分两种形态。
    几何模型为示意（轨道高度相对地球半径已夸大），但仰角弧与剔除楔形同源，
    画出来的角与算出来的角严格一致。
  -->
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
    }
    .viewport-area {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 45% 30%, #ffffff 0%, #f7f9fc 68%, #eef2f7 100%);
      overflow: hidden;
    }
    #space-svg {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      display: block;
      font-family: inherit;
    }
  </style>
</head>
<body>

<div class="viewport-area">
  <svg id="space-svg" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet">
    <defs>
      <!--
        地球表面：只画露在画面里的那一条弧带，故渐变的 y 范围就取这条带子本身
        （userSpaceOnUse）。用默认的 objectBoundingBox 会摊到整个圆上，
        可见的顶部几十像素就都落在最亮的那一档，整条弧带会淡到看不见。
      -->
      <linearGradient id="earthGrad" gradientUnits="userSpaceOnUse" x1="480" y1="340" x2="480" y2="540">
        <stop offset="0%" stop-color="#edf3f9" />
        <stop offset="100%" stop-color="#c6d4e4" />
      </linearGradient>

      <!-- 不满足约束区：斜纹 + 淡红色底，避免与几何线条混淆 -->
      <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="9" stroke="#dc2626" stroke-width="1.1" stroke-opacity="0.20" />
      </pattern>
    </defs>

    <!-- ============ 地球（示意：半径已夸大） ============ -->
    <g id="layer-earth">
      <circle cx="480" cy="680" r="340" fill="url(#earthGrad)" />
      <circle cx="480" cy="680" r="352" fill="none" stroke="#7dd3fc" stroke-width="16" opacity="0.20" />
      <circle cx="480" cy="680" r="344" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.28" />
      <circle cx="480" cy="680" r="340" fill="none" stroke="#a8bccf" stroke-width="1.3" />
    </g>

    <!-- ============ 参考基准：当地水平面与天顶方向 ============ -->
    <g id="layer-ref">
      <line x1="0" y1="340" x2="960" y2="340" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="8 6" />
      <text x="16" y="330" fill="#94a3b8" font-size="10.5">当地水平面（仰角 0°）</text>
      <line x1="480" y1="340" x2="480" y2="96" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5" />
      <text x="480" y="88" fill="#94a3b8" font-size="10.5" text-anchor="middle">天顶方向（90°）</text>
    </g>

    <!-- ============ 最小俯仰角以下的剔除区 ============ -->
    <g id="layer-excluded">
      <path id="wedge-r" fill="#dc2626" fill-opacity="0.05" />
      <path id="wedge-l" fill="#dc2626" fill-opacity="0.05" />
      <path id="wedge-r-h" fill="url(#hatch)" />
      <path id="wedge-l-h" fill="url(#hatch)" />
      <line id="ray-r" stroke="#d97706" stroke-width="1.8" stroke-dasharray="7 5" />
      <line id="ray-l" stroke="#d97706" stroke-width="1.8" stroke-dasharray="7 5" />
      <text id="label-min" fill="#b45309" font-size="10.5" font-weight="700" stroke="#ffffff" stroke-width="3" paint-order="stroke">最小俯仰角 = 25°</text>
    </g>

    <!-- ============ 区域目标（地面面状目标，视角顶点取其中心） ============ -->
    <g id="layer-target">
      <path id="patch" fill="#7c3aed" fill-opacity="0.22" stroke="#7c3aed" stroke-width="1.4" />
      <circle cx="480" cy="340" r="3.6" fill="#5b21b6" stroke="#ffffff" stroke-width="1.8" />
      <text x="480" y="377" fill="#6d28d9" font-size="10.5" font-weight="700" text-anchor="middle">区域目标</text>
    </g>

    <!-- ============ 随过境进程变化的部分 ============ -->
    <g id="dyn-layer">
      <!-- 视线 -->
      <line id="los" stroke="#059669" stroke-width="2.6" stroke-linecap="round" />
      <circle id="los-pulse" r="3.4" fill="#059669" />

      <!-- 仰角弧与读数 -->
      <path id="el-arc" fill="none" stroke="#059669" stroke-width="2" />
      <rect id="el-pill" rx="4" ry="4" fill="#ffffff" fill-opacity="0.94" stroke="#059669" stroke-width="1" />
      <text id="el-arc-label" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">仰角</text>

      <!-- 分析对象（卫星）：本体随轨道切线转角，名牌单独一层、只平移不旋转 -->
      <g id="sat-group">
        <circle id="sat-ring" r="13" fill="none" stroke="#0284c7" stroke-width="1.3" opacity="0.75" />
        <g>
          <rect x="-26" y="-4.5" width="15" height="9" rx="1.5" fill="#bfdbfe" stroke="#2563eb" stroke-width="0.9" />
          <rect x="11" y="-4.5" width="15" height="9" rx="1.5" fill="#bfdbfe" stroke="#2563eb" stroke-width="0.9" />
          <line x1="-11" y1="0" x2="11" y2="0" stroke="#64748b" stroke-width="1.4" />
          <rect x="-6.5" y="-6.5" width="13" height="13" rx="2" fill="#d97706" stroke="#b45309" stroke-width="1" />
          <rect x="-3.5" y="-3.5" width="7" height="7" fill="#fbbf24" />
        </g>
      </g>
      <text id="sat-label" fill="#334155" font-size="10.5" font-weight="700" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke">分析对象</text>
    </g>

    <!-- ============ 画面左上：当前仰角与判定结论 ============ -->
    <g id="readout">
      <text x="34" y="30" fill="#64748b" font-size="11.5" font-weight="500">当前仰角</text>
      <text id="el-value" x="34" y="64" fill="#059669" font-size="30" font-weight="800" font-variant-numeric="tabular-nums">90.0°</text>
      <circle id="status-dot" cx="258" cy="46" r="5.5" fill="#059669" />
      <text id="status-text" x="272" y="52" fill="#059669" font-size="14" font-weight="700">≥ 25.0° · 访问有效</text>
    </g>

    <!-- ============ 画面右上：判定规则与模型说明 ============ -->
    <g id="legend">
      <text x="944" y="26" fill="#475569" font-size="11" text-anchor="end">仰角 ≥ 最小俯仰角：访问<tspan fill="#059669" font-weight="700">有效</tspan></text>
      <text x="944" y="44" fill="#475569" font-size="11" text-anchor="end">仰角 &lt; 最小俯仰角：该次访问<tspan fill="#dc2626" font-weight="700">被剔除</tspan></text>
      <text x="944" y="64" fill="#94a3b8" font-size="9.5" text-anchor="end">示意模型：轨道高度相对地球半径已夸大，非等比例</text>
    </g>
  </svg>
</div>

<script>
  /*
   * 二维过境剖面模型（示意，非等比例）：
   *   地球按半径 R_E 画成圆，区域目标位于其正上方顶点 G；
   *   卫星沿半径 R_S 的圆弧过境，地心角 λ 从 -LAM_MAX 扫到 +LAM_MAX。
   *   仰角 —— 自 G 的当地水平面量到视线 —— 由同一套几何直接算出：
   *       El = atan2(R_S·cosλ - R_E, |R_S·sinλ|)
   *   因此楔形边界、仰角弧、底部曲线用的是同一个角度，不会互相打架。
   */
  (function () {
    'use strict';

    /* ---------- 场景常量 ---------- */
    const GX = 480, GY = 340;        // 区域目标中心 = 仰角顶点
    const R_E = 340;                 // 地球示意半径 (px)
    const EARTH_CY = GY + R_E;       // 地球圆心 (px)
    const R_S = 493;                 // 卫星轨道示意半径 (px)，R_S/R_E ≈ 1.45
    const LAM_MAX = 35;              // 过境期间扫过的地心角半宽 (°)
    const THETA_MIN = 25;            // 最小俯仰角 (°)
    const PASS_MIN = 18;             // 过境总时长 (min)
    const PASS_S = PASS_MIN * 60;
    const LOOP_S = 22;               // 一轮播放的墙钟时长 (s)
    const ARC_R = 68;                // 仰角弧半径 (px)
    const WEDGE_R = 300;             // 剔除楔形半径 (px)
    const AXIS_R = 336;              // 最小俯仰角射线长度 (px)
    const PATCH_HALF = 10;           // 区域目标的地心角半宽 (°)
    const FADE = 0.045;              // 首尾淡入淡出所占行程比

    /* ---------- 几何与坐标工具 ---------- */
    const toRad = (d) => d * Math.PI / 180;
    const $ = (id) => document.getElementById(id);

    // 自仰角顶点 G 出发：upR/upL 按给定仰角和半径取左右两侧的点
    const upR = (e, r) => [GX + r * Math.cos(toRad(e)), GY - r * Math.sin(toRad(e))];
    const upL = (e, r) => [GX - r * Math.cos(toRad(e)), GY - r * Math.sin(toRad(e))];

    // 卫星在地心角 λ 处的位置（λ > 0 在右侧）
    const satPos = (lam) => {
      const l = toRad(lam);
      return { x: GX + R_S * Math.sin(l), y: EARTH_CY - R_S * Math.cos(l) };
    };

    // 区域目标处看到的卫星仰角
    const elevationOf = (lam) => {
      const l = toRad(lam);
      const up = R_S * Math.cos(l) - R_E;
      const horiz = Math.abs(R_S * Math.sin(l));
      return Math.atan2(up, horiz) * 180 / Math.PI;
    };

    const lamAt = (t) => -LAM_MAX + 2 * LAM_MAX * (t / PASS_S);

    function setLine(el, x1, y1, x2, y2) {
      if (!el) return;
      el.setAttribute('x1', x1); el.setAttribute('y1', y1);
      el.setAttribute('x2', x2); el.setAttribute('y2', y2);
    }

    // 给文字套一层底色块：尺寸按文字实际包围盒算
    function fitPill(textEl, pillEl, padX, height, fontSize) {
      if (!textEl || !pillEl) return;
      const str = textEl.textContent || '';
      let w = 0;
      try { w = textEl.getBBox().width; } catch (e) { w = 0; }
      if (!w) w = str.length * fontSize * 0.62;
      const x = parseFloat(textEl.getAttribute('x')) || 0;
      const y = parseFloat(textEl.getAttribute('y')) || 0;
      const cy = y - fontSize * 0.35;
      pillEl.setAttribute('x', x - w / 2 - padX);
      pillEl.setAttribute('y', cy - height / 2);
      pillEl.setAttribute('width', w + padX * 2);
      pillEl.setAttribute('height', height);
    }

    /* ---------- DOM 引用 ---------- */
    const dynLayer = $('dyn-layer');
    const los = $('los');
    const losPulse = $('los-pulse');
    const elArc = $('el-arc');
    const elPill = $('el-pill');
    const elArcLabel = $('el-arc-label');
    const satGroup = $('sat-group');
    const satRing = $('sat-ring');
    const satLabel = $('sat-label');

    const elValue = $('el-value');
    const statusDot = $('status-dot');
    const statusText = $('status-text');

    /* ---------- 一次性构建静态几何 ---------- */
    function buildStatic() {
      // 剔除楔形：自水平面（0°）到最小俯仰角射线之间的那一条
      const wR0 = upR(0, WEDGE_R), wR1 = upR(THETA_MIN, WEDGE_R);
      const dR = 'M ' + GX + ' ' + GY + ' L ' + wR0[0].toFixed(1) + ' ' + wR0[1].toFixed(1) +
        ' A ' + WEDGE_R + ' ' + WEDGE_R + ' 0 0 0 ' + wR1[0].toFixed(1) + ' ' + wR1[1].toFixed(1) + ' Z';
      const wL0 = upL(0, WEDGE_R), wL1 = upL(THETA_MIN, WEDGE_R);
      const dL = 'M ' + GX + ' ' + GY + ' L ' + wL0[0].toFixed(1) + ' ' + wL0[1].toFixed(1) +
        ' A ' + WEDGE_R + ' ' + WEDGE_R + ' 0 0 1 ' + wL1[0].toFixed(1) + ' ' + wL1[1].toFixed(1) + ' Z';
      $('wedge-r').setAttribute('d', dR);
      $('wedge-r-h').setAttribute('d', dR);
      $('wedge-l').setAttribute('d', dL);
      $('wedge-l-h').setAttribute('d', dL);

      // 最小俯仰角射线（比楔形略长一截，让边界明确）
      const aR = upR(THETA_MIN, AXIS_R), aL = upL(THETA_MIN, AXIS_R);
      setLine($('ray-r'), GX, GY, aR[0], aR[1]);
      setLine($('ray-l'), GX, GY, aL[0], aL[1]);
      const lm = $('label-min');
      lm.setAttribute('x', aR[0] + 6);
      lm.setAttribute('y', aR[1] + 4);
      lm.textContent = '最小俯仰角 = ' + THETA_MIN.toFixed(0) + '°';

      // 区域目标：贴着球面的一小片面元
      const surf = (d, r) => [GX + r * Math.sin(toRad(d)), EARTH_CY - r * Math.cos(toRad(d))];
      let d = '';
      for (let a = -PATCH_HALF; a <= PATCH_HALF + 0.01; a += 2.5) {
        const p = surf(a, R_E);
        d += (d ? ' L ' : 'M ') + p[0].toFixed(1) + ' ' + p[1].toFixed(1);
      }
      for (let a = PATCH_HALF; a >= -PATCH_HALF - 0.01; a -= 2.5) {
        const p = surf(a, R_E - 13);
        d += ' L ' + p[0].toFixed(1) + ' ' + p[1].toFixed(1);
      }
      $('patch').setAttribute('d', d + ' Z');
    }

    /* ---------- 每帧刷新 ---------- */
    const state = { t: 0, pulse: 0 };
    let pulseT = 0;

    function updateScene(t) {
      const lam = lamAt(t);
      const el = elevationOf(lam);
      const ok = el >= THETA_MIN;
      const col = ok ? '#059669' : '#dc2626';
      const dark = ok ? '#047857' : '#b91c1c';
      const sat = satPos(lam);

      /* --- 视线 --- */
      setLine(los, GX, GY, sat.x, sat.y);
      los.setAttribute('stroke', col);
      losPulse.setAttribute('fill', col);
      pulseT = (pulseT + 0.014) % 1;
      losPulse.setAttribute('cx', GX + (sat.x - GX) * pulseT);
      losPulse.setAttribute('cy', GY + (sat.y - GY) * pulseT);

      /* --- 仰角弧（卫星在右半侧时画在右侧，反之镜像） --- */
      const right = lam >= 0;
      const arcEnd = right ? upR(el, ARC_R) : upL(el, ARC_R);
      const arcStart = right ? [GX + ARC_R, GY] : [GX - ARC_R, GY];
      elArc.setAttribute('d',
        'M ' + arcStart[0] + ' ' + arcStart[1] +
        ' A ' + ARC_R + ' ' + ARC_R + ' 0 0 ' + (right ? 0 : 1) + ' ' +
        arcEnd[0].toFixed(2) + ' ' + arcEnd[1].toFixed(2));
      elArc.setAttribute('stroke', col);

      const mid = el / 2;
      const lp = right ? upR(mid, ARC_R + 26) : upL(mid, ARC_R + 26);
      elArcLabel.setAttribute('x', lp[0].toFixed(1));
      elArcLabel.setAttribute('y', (lp[1] + 4).toFixed(1));
      elArcLabel.setAttribute('fill', dark);
      elArcLabel.textContent = el.toFixed(1) + '°';
      elPill.setAttribute('stroke', col);
      fitPill(elArcLabel, elPill, 7, 18, 11);

      /* --- 分析对象 --- */
      if (satGroup) satGroup.setAttribute('transform', 'translate(' + sat.x.toFixed(2) + ', ' + sat.y.toFixed(2) + ') rotate(' + lam.toFixed(2) + ')');
      if (satLabel) {
        satLabel.setAttribute('x', sat.x.toFixed(2));
        satLabel.setAttribute('y', (sat.y - 22).toFixed(2));
      }
      if (satRing) {
        const ph = (state.pulse += 0.6) % 26;
        satRing.setAttribute('r', 13 + ph * 0.6);
        satRing.setAttribute('opacity', Math.max(0, 0.7 - ph * 0.028));
      }

      /* --- 读数 --- */
      const valStr = el.toFixed(1) + '°';
      elValue.textContent = valStr;
      elValue.setAttribute('fill', col);
      statusDot.setAttribute('fill', col);
      statusText.setAttribute('fill', dark);
      statusText.textContent = (ok ? '≥ ' : '< ') + THETA_MIN.toFixed(1) + '° · ' +
        (ok ? '访问有效' : '该次访问被剔除');

      /* --- 首尾淡入淡出，掩掉循环复位 --- */
      const p = t / PASS_S;
      const fade = Math.min(1, Math.min(p / FADE, (1 - p) / FADE));
      dynLayer.setAttribute('opacity', Math.max(0, fade).toFixed(3));
    }

    /* ---------- 动画循环 ---------- */
    let animationFrameId = null;
    let isRunning = false;
    let lastTs = 0;

    function loop(ts) {
      if (!isRunning) return;
      const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
      lastTs = ts;

      state.t += dt * (PASS_S / LOOP_S);
      if (state.t > PASS_S) state.t -= PASS_S;

      updateScene(state.t);
      animationFrameId = requestAnimationFrame(loop);
    }

    /* ---------- 标准动画控制契约接口 ---------- */
    window.startAnimation = function () {
      if (!isRunning) {
        isRunning = true;
        lastTs = 0;
        animationFrameId = requestAnimationFrame(loop);
      }
    };

    window.stopAnimation = function () {
      isRunning = false;
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
    };

    window.resetAnimation = function () {
      state.t = 0;
      state.pulse = 0;
      pulseT = 0;
      updateScene(0);
      window.startAnimation();
    };

    /* ---------- 初始化与自启动 ---------- */
    buildStatic();
    updateScene(0);
    window.startAnimation();
  })();
</script>

</body>
</html>
