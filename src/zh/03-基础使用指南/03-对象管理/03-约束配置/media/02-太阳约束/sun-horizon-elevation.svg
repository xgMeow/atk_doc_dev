<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360"
     role="img" aria-labelledby="svgTitle svgDesc">

  <title id="svgTitle">太阳地平仰角示意图</title>
  <desc id="svgDesc">说明太阳地平仰角的定义：顶点在参考地面对象 G，以 G 的当地水平面为零度基准，太阳方向位于该平面以上为正仰角，以下为负仰角。</desc>

  <defs>
    <linearGradient id="shBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>

    <linearGradient id="shEarth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2f7"/>
      <stop offset="100%" stop-color="#dae2ec"/>
    </linearGradient>

    <radialGradient id="shSun" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>

    <marker id="shArwSun" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="shArwSunFaint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706" opacity="0.65"/>
    </marker>
    <marker id="shArwZenith" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed"/>
    </marker>

    <clipPath id="shPanel1">
      <rect x="0" y="50" width="820" height="400"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="820" height="360" fill="url(#shBg)"/>

  <!-- ==================== 太阳地平仰角的定义 ==================== -->
  <!-- 画布不含标题，整体上移 78px 使内容顶边留下约 18px 边距 -->
  <g transform="translate(0,-78)">
    <!-- 地表 -->
    <g clip-path="url(#shPanel1)">
      <circle cx="410" cy="1200" r="900" fill="url(#shEarth)"/>
      <circle cx="410" cy="1200" r="900" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>
    </g>

    <!-- 当地水平面：过 G、垂直于当地天顶 -->
    <ellipse cx="410" cy="300" rx="132" ry="11" fill="rgba(148,163,184,0.13)" stroke="rgba(148,163,184,0.45)" stroke-width="1"/>
    <line x1="274" y1="300" x2="560" y2="300" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="7 5"/>
    <text x="276" y="284" font-size="12.5" fill="#64748b">当地水平面</text>

    <!-- 当地天顶（法线） -->
    <line x1="410" y1="300" x2="410" y2="96" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#shArwZenith)"/>
    <text x="402" y="110" font-size="12.5" fill="#6d28d9" text-anchor="end">当地天顶（法线）</text>

    <!-- 直角标记：当地天顶 ⊥ 当地水平面 -->
    <path d="M 410 286 L 421 286 L 421 300" fill="none" stroke="#94a3b8" stroke-width="1"/>

    <!-- 太阳方向（正仰角） -->
    <line x1="410" y1="300" x2="586.1" y2="141.4" stroke="#d97706" stroke-width="2.4" marker-end="url(#shArwSun)"/>
    <g>
      <circle cx="595.8" cy="132.7" r="13" fill="url(#shSun)"/>
      <g stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round">
        <line x1="595.8" y1="115.7" x2="595.8" y2="109.7"/>
        <line x1="607.8" y1="120.7" x2="612.1" y2="116.4"/>
        <line x1="612.8" y1="132.7" x2="618.8" y2="132.7"/>
        <line x1="607.8" y1="144.7" x2="612.1" y2="149.0"/>
        <line x1="595.8" y1="149.7" x2="595.8" y2="155.7"/>
        <line x1="583.8" y1="144.7" x2="579.5" y2="149.0"/>
        <line x1="578.8" y1="132.7" x2="572.8" y2="132.7"/>
        <line x1="583.8" y1="120.7" x2="579.5" y2="116.4"/>
      </g>
    </g>
    <text x="623" y="128" font-size="13.5" font-weight="700" fill="#b45309">太阳</text>

    <!-- 仰角弧：当地水平面 → 太阳方向 -->
    <path d="M 494 300 A 84 84 0 0 0 472.4 243.8" fill="none" stroke="#d97706" stroke-width="2.1"/>
    <text x="514" y="266" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">E &gt; 0</text>
    <text x="548" y="285" font-size="11.5" fill="#94a3b8">（当地水平面以上，正仰角）</text>

    <!-- 负仰角：太阳方向位于当地水平面以下 -->
    <line x1="410" y1="300" x2="542.4" y2="370.4" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5" opacity="0.75" marker-end="url(#shArwSunFaint)"/>
    <path d="M 462 300 A 52 52 0 0 1 455.9 324.4" fill="none" stroke="#d97706" stroke-width="1.9" opacity="0.75"/>
    <text x="552" y="384" font-size="14" font-weight="700" fill="#b45309" opacity="0.8">E &lt; 0</text>
    <text x="552" y="402" font-size="11.5" fill="#94a3b8">（当地水平面以下，负仰角）</text>

    <!-- G 点 -->
    <circle cx="410" cy="300" r="4.5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/>
    <text x="402" y="344" font-size="13.5" font-weight="700" fill="#6d28d9" text-anchor="end">地面对象 G</text>
  </g>
</svg>
