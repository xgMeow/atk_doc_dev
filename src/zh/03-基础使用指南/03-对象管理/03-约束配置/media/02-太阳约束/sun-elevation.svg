<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 70 820 380"
     role="img" aria-labelledby="seTitle seDesc">

  <title id="seTitle">太阳仰角示意图</title>
  <desc id="seDesc">顶点在分析对象 A，基准面为 A 自身本体系的 OXY 平面，由体坐标系的 OX_b、OY_b 轴张成，指向天顶一侧的法向为本体系天顶 -Z_b；两条轴都自原点引出，端部落在基准面的边界上，以示二者都位于该基准面内。该基准面随 A 的本体姿态确定：图中 A 的姿态相对中心天体径向倾斜 25 度，故基准面不与垂直于径向的平面重合；对天体定向（OZ_b 轴指向中心天体）的对象，二者重合。太阳方向位于基准面以上时仰角为正（E &gt; 0），位于以下时为负（E &lt; 0）。</desc>

  <defs>
    <linearGradient id="seBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="seEarth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2f7"/>
      <stop offset="100%" stop-color="#dae2ec"/>
    </linearGradient>
    <radialGradient id="seSun" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <linearGradient id="seBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22b8d6"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>

    <marker id="seArwSun" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="seArwSunFaint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706" opacity="0.62"/>
    </marker>
    <marker id="seArwBody" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0891b2"/>
    </marker>
    <marker id="seArwZen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.0" markerHeight="4.0" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#94a3b8"/>
    </marker>

    <clipPath id="seClip">
      <rect x="0" y="70" width="820" height="380"/>
    </clipPath>
  </defs>

  <rect x="0" y="70" width="820" height="380" fill="url(#seBg)"/>

  <!-- ============================ 中心天体 ============================ -->
  <g clip-path="url(#seClip)">
    <circle cx="400" cy="860.0" r="500.0" fill="url(#seEarth)"/>
    <circle cx="400" cy="860.0" r="500.0" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>
  </g>

  <!-- ========= 中心天体径向：A 指向中心天体的方向，仅作方位参照 ========= -->
  <line x1="400" y1="228.0" x2="400" y2="336" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="3 4"/>

  <!-- ==================== 分析对象 A 的本体系（整体按姿态倾斜） ==================== -->
  <g transform="rotate(25.0 400 228.0)">
    <!-- 基准面：本体系 OXY 平面，即仰角的零度基准 -->
    <ellipse cx="400" cy="228.0" rx="152.0" ry="20.0"
             fill="rgba(148,163,184,0.14)" stroke="rgba(148,163,184,0.5)" stroke-width="1"/>
    <!-- 面内 OX / OY 轴：面内两个正交方向在此视角下（正交投影）的像互为共轭直径，
         端部都落在基准面的边界上，因此两条轴看起来都「躺在」基准面内 -->
    <line x1="400" y1="228.0" x2="343.1" y2="246.5" stroke="#0891b2" stroke-width="2.2" marker-end="url(#seArwBody)"/>
    <line x1="400" y1="228.0" x2="540.9" y2="235.5" stroke="#0891b2" stroke-width="2.2" marker-end="url(#seArwBody)"/>
  </g>

  <!-- 本体系 Z 轴：垂直于基准面，本体系 OZ 轴指向中心天体一侧 -->
  <line x1="400" y1="228.0" x2="350.1" y2="334.9"
        stroke="#0891b2" stroke-width="2.2" marker-end="url(#seArwBody)"/>

  <!-- 本体系天顶（-Z_b）：基准面指向天顶一侧的法向 -->
  <line x1="400" y1="228.0" x2="449.9" y2="121.1"
        stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seArwZen)"/>

  <!-- ==================== 太阳方向：仰角为正 ==================== -->
  <line x1="400" y1="228.0" x2="521.4" y2="171.4"
        stroke="#d97706" stroke-width="2.4" marker-end="url(#seArwSun)"/>
  <path d="M 470.6 265.7 A 80.0 80.0 0 0 0 472.5 194.2" fill="none" stroke="#d97706" stroke-width="2.1"/>

  <!-- ==================== 太阳方向：仰角为负 ==================== -->
  <line x1="400" y1="228.0" x2="461.9" y2="316.5"
        stroke="#d97706" stroke-width="1.9" stroke-dasharray="7 5" opacity="0.62" marker-end="url(#seArwSunFaint)"/>
  <path d="M 470.6 265.7 A 80.0 80.0 0 0 1 445.9 293.5" fill="none" stroke="#d97706" stroke-width="1.7" opacity="0.62"/>

  <!-- ==================== 分析对象 A（卫星示意图，中心即本体系原点） ==================== -->
  <g transform="rotate(25.0 400 228.0)">
    <rect x="338" y="220.5" width="34" height="15" rx="2" fill="#0891b2" stroke="#ffffff" stroke-width="1"/>
    <rect x="428" y="220.5" width="34" height="15" rx="2" fill="#0891b2" stroke="#ffffff" stroke-width="1"/>
    <rect x="378" y="215" width="44" height="26" rx="3.5" fill="url(#seBody)" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- ==================== 太阳 ==================== -->
  <g>
    <circle cx="532.8" cy="166.1" r="13.0" fill="url(#seSun)"/>
    <g stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round">
      <line x1="532.8" y1="149.1" x2="532.8" y2="143.1"/>
      <line x1="544.8" y1="154.1" x2="549.1" y2="149.8"/>
      <line x1="549.8" y1="166.1" x2="555.8" y2="166.1"/>
      <line x1="544.8" y1="178.1" x2="549.1" y2="182.4"/>
      <line x1="532.8" y1="183.1" x2="532.8" y2="189.1"/>
      <line x1="520.8" y1="178.1" x2="516.5" y2="182.4"/>
      <line x1="515.8" y1="166.1" x2="509.8" y2="166.1"/>
      <line x1="520.8" y1="154.1" x2="516.5" y2="149.8"/>
    </g>
  </g>

  <!-- ==================== 文字标注 ==================== -->
  <text x="561.8" y="171.1" font-size="13.5" font-weight="700" fill="#b45309">太阳</text>
  <text x="535.1" y="304.5" font-size="13" font-weight="700" fill="#0e7490">OX</text>
  <text x="328.7" y="223.9" font-size="13" font-weight="700" fill="#0e7490" text-anchor="end">OY</text>
  <text x="341.4" y="300.0" font-size="13" font-weight="700" fill="#0e7490" text-anchor="end">OZ</text>
  <text x="456.9" y="125.1" font-size="12.5" fill="#64748b">本体系天顶（-Z）</text>
  <text x="503" y="233" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">E &gt; 0</text>
  <text x="480" y="337" font-size="14" font-weight="700" fill="#b45309">E &lt; 0</text>
  <text x="480" y="353" font-size="11.5" fill="#94a3b8">（基准面以下）</text>
  <text x="400" y="352" font-size="12" fill="#94a3b8" text-anchor="middle">中心天体径向</text>
  <text x="288" y="202" font-size="12.5" fill="#64748b" text-anchor="end">本体系 OXY 基准面（E = 0）</text>

  <!-- A 点引出线 -->
  <line x1="290" y1="153" x2="344" y2="194" stroke="#0891b2" stroke-width="1" opacity="0.6"/>
  <text x="250" y="150" font-size="13.5" font-weight="700" fill="#0e7490" text-anchor="middle">分析对象 A</text>

  <!-- 原点标记 -->
  <circle cx="400" cy="228.0" r="3.4" fill="#0e7490" stroke="#ffffff" stroke-width="1.5"/>
</svg>
