<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 0 880 490"
     role="img" aria-labelledby="svgTitle svgDesc">

  <title id="svgTitle">太阳规避角示意图</title>
  <desc id="svgDesc">以分析对象 A 为顶点，比较访问视线与太阳方向之间的夹角 α 与阈值 θ：以太阳方向为轴、θ 为半角作出禁止锥，视线落入锥内（α₂ = 13° 小于 θ = 25°）时太阳过近，该时刻不满足约束；视线落在锥外（α₁ = 43° 不小于 θ）时满足约束。底部标尺给出视线偏离太阳方向 0° 至 90° 的区间划分，并标出两条视线所在的角位置。</desc>

  <defs>
    <linearGradient id="seBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>

    <!-- 禁止锥：顶点处浓、锥底处淡 -->
    <linearGradient id="seCone" gradientUnits="userSpaceOnUse"
                    x1="150" y1="340" x2="453.1" y2="127.8">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#fb7185" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0.06"/>
    </linearGradient>

    <radialGradient id="seSun" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>

    <marker id="seArwSun" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="seArwOk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#047857"/>
    </marker>
    <marker id="seArwBad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="490" fill="url(#seBg)"/>

  <!-- 内容整体上移，去掉标题与脚注后按图幅重新排版 -->
  <g transform="translate(0,-52)">

  <!-- ==================== 禁止锥（半角 θ = 25°，轴为太阳方向） ==================== -->
  <path d="M 150 340 L 447.5 289.1
           A 130.6 44.4 55 1 0 299.5 77.7 Z"
        fill="url(#seCone)"/>

  <!-- 锥底所在圆：虚线给出三维形状 -->
  <ellipse cx="379.3" cy="179.4" rx="130.6" ry="44.4"
           transform="rotate(55 379.3 179.4)"
           fill="none" stroke="#fb7185" stroke-width="1.3" stroke-dasharray="6 4" opacity="0.75"/>

  <!-- 锥的两条母线 = 允许方向的边界 -->
  <line x1="150" y1="340" x2="447.5" y2="289.1"
        stroke="#f43f5e" stroke-width="1.7" stroke-dasharray="8 5" opacity="0.8"/>
  <line x1="150" y1="340" x2="299.5" y2="77.7"
        stroke="#f43f5e" stroke-width="1.7" stroke-dasharray="8 5" opacity="0.8"/>

  <!-- 锥体本身的名字 -->
  <text x="300" y="165" font-size="13.5" font-weight="700" fill="#be123c" text-anchor="middle"
        stroke="#ffffff" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">禁止锥</text>

  <!-- ==================== 锥轴 = 太阳方向 ==================== -->
  <line x1="150" y1="340" x2="430.2" y2="143.8"
        stroke="#d97706" stroke-width="1.9" stroke-dasharray="9 5" marker-end="url(#seArwSun)"/>
  <text x="410" y="126" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="end"
        stroke="#ffffff" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">太阳方向（锥轴）</text>

  <!-- 太阳 -->
  <g>
    <circle cx="453.1" cy="127.8" r="15" fill="url(#seSun)"/>
    <g stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round">
      <line x1="472.1" y1="127.8" x2="479.6" y2="127.8"/>
      <line x1="466.5" y1="114.4" x2="471.8" y2="109.1"/>
      <line x1="453.1" y1="108.8" x2="453.1" y2="101.3"/>
      <line x1="439.7" y1="114.4" x2="434.4" y2="109.1"/>
      <line x1="434.1" y1="127.8" x2="426.6" y2="127.8"/>
      <line x1="439.7" y1="141.2" x2="434.4" y2="146.5"/>
      <line x1="453.1" y1="146.8" x2="453.1" y2="154.3"/>
      <line x1="466.5" y1="141.2" x2="471.8" y2="146.5"/>
    </g>
  </g>
  <text x="487" y="132" font-size="13.5" font-weight="700" fill="#b45309">太阳</text>

  <!-- ==================== 角度弧 ==================== -->
  <!-- θ：锥轴 → 锥的母线 -->
  <path d="M 213.9 295.3 A 78 78 0 0 1 226.9 326.9" fill="none" stroke="#e11d48" stroke-width="2.2"/>
  <text x="296" y="340" font-size="13" font-weight="700" fill="#be123c" text-anchor="end"
        stroke="#ffffff" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">α_min</text>

  <!-- α₁：锥轴 → 满足视线 -->
  <path d="M 279.4 249.4 A 158 158 0 0 1 306.5 362.0" fill="none" stroke="#047857" stroke-width="2"/>
  <text x="318" y="380" font-size="13" font-weight="700" fill="#047857"
        stroke="#ffffff" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">α₁</text>

  <!-- ==================== 两条访问视线 ==================== -->
  <!-- 不满足：落在锥内 -->
  <line x1="150" y1="340" x2="659.0" y2="134.3"
        stroke="#dc2626" stroke-width="2.6" marker-end="url(#seArwBad)"/>
  <circle cx="669.2" cy="130.2" r="6.5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.8"/>
  <text x="669.2" y="162" font-size="12.5" font-weight="700" fill="#6d28d9" text-anchor="middle"
        stroke="#ffffff" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">关联对象 B′</text>

  <!-- 满足：落在锥外 -->
  <line x1="150" y1="340" x2="594.6" y2="402.5"
        stroke="#047857" stroke-width="2.6" marker-end="url(#seArwOk)"/>
  <circle cx="605.5" cy="404.0" r="6.5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.8"/>
  <text x="620.0" y="408.5" font-size="12.5" font-weight="700" fill="#6d28d9"
        stroke="#ffffff" stroke-width="3.2" paint-order="stroke" stroke-linejoin="round">关联对象 B</text>

  <!-- ==================== 结果标签 ==================== -->
  <line x1="677" y1="130" x2="690" y2="130" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
  <rect x="688" y="112" width="172" height="36" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="700" y="135" font-size="13.5" font-weight="700" fill="#b91c1c">α₂ = 13° → 不满足</text>

  <line x1="605.5" y1="396" x2="605.5" y2="386" stroke="#047857" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
  <rect x="560" y="348" width="172" height="36" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="572" y="371" font-size="13.5" font-weight="700" fill="#065f46">α₁ = 43° → 满足</text>

  <!-- ==================== 分析对象 A ==================== -->
  <circle cx="150" cy="340" r="5" fill="#0891b2" stroke="#ffffff" stroke-width="1.6"/>
  <text x="140" y="332" font-size="13.5" font-weight="700" fill="#0e7490" text-anchor="end">分析对象 A</text>
  <text x="140" y="349" font-size="10.5" fill="#94a3b8" text-anchor="end">角的顶点</text>

  <!-- ==================== 角度判据标尺 ==================== -->
  <line x1="12" y1="436" x2="868" y2="436" stroke="#e2e8f0" stroke-width="1"/>

  <!-- 标尺：α 由 0°（正对太阳）到 90° -->
  <rect x="140" y="485" width="640" height="16" rx="8" fill="#10b981" fill-opacity="0.18"/>
  <rect x="140" y="485" width="177.8" height="16" rx="8" fill="#f43f5e" fill-opacity="0.26"/>

  <!-- 阈值分界 -->
  <line x1="317.8" y1="481" x2="317.8" y2="505" stroke="#e11d48" stroke-width="2"/>
  <text x="317.8" y="475" font-size="12" font-weight="700" fill="#e11d48" text-anchor="middle"
        stroke="#ffffff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">θ = 25°</text>

  <!-- 刻度 -->
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="140" y1="501" x2="140" y2="507"/>
    <line x1="246.7" y1="501" x2="246.7" y2="507"/>
    <line x1="353.3" y1="501" x2="353.3" y2="507"/>
    <line x1="460" y1="501" x2="460" y2="507"/>
    <line x1="566.7" y1="501" x2="566.7" y2="507"/>
    <line x1="673.3" y1="501" x2="673.3" y2="507"/>
    <line x1="780" y1="501" x2="780" y2="507"/>
  </g>
  <g font-size="11.5" fill="#94a3b8" text-anchor="middle">
    <text x="140" y="522">0°</text>
    <text x="246.7" y="522">15°</text>
    <text x="353.3" y="522">30°</text>
    <text x="460" y="522">45°</text>
    <text x="566.7" y="522">60°</text>
    <text x="673.3" y="522">75°</text>
    <text x="780" y="522">90°</text>
  </g>

  <!-- 两条视线在标尺上的角位置 -->
  <line x1="232.4" y1="485" x2="232.4" y2="458" stroke="#dc2626" stroke-width="1.6"/>
  <circle cx="232.4" cy="493" r="4.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
  <text x="232.4" y="452" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">α₂ = 13° → 不满足</text>

  <line x1="445.8" y1="485" x2="445.8" y2="458" stroke="#047857" stroke-width="1.6"/>
  <circle cx="445.8" cy="493" r="4.5" fill="#047857" stroke="#ffffff" stroke-width="1.5"/>
  <text x="445.8" y="452" font-size="12.5" font-weight="700" fill="#047857" text-anchor="middle">α₁ = 43° → 满足</text>

  </g>
</svg>
