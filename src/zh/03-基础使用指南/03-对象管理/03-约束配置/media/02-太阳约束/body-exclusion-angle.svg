<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480"
     role="img" aria-labelledby="svgTitle svgDesc">

  <title id="svgTitle">天体规避角示意图</title>
  <desc id="svgDesc">以分析对象 A 为顶点、天体 K 的方向为轴、阈值角 α_min 为半角，作出一支禁止圆锥；顶点到天体方向的夹角小于 α_min 的方向都落在锥内。图中两条访问视线作对比：一条落在锥内，其与天体方向的夹角 α₂ 小于 α_min，该时刻不满足天体规避角；另一条落在锥外，夹角 α₁ 不小于 α_min，满足约束。</desc>

  <defs>
    <linearGradient id="exBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>

    <!-- 禁止锥：顶点处浓、锥底处淡 -->
    <linearGradient id="exCone" gradientUnits="userSpaceOnUse"
                    x1="100.0" y1="220.0" x2="344.5" y2="168.0">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#fb7185" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0.09"/>
    </linearGradient>

    <radialGradient id="exBody" cx="36%" cy="32%" r="74%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="55%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>

    <marker id="exArwAxis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="exArwOk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#047857"/>
    </marker>
    <marker id="exArwBad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="480" fill="url(#exBg)"/>

  <!-- ==================== 禁止锥（半角 α_min） ==================== -->
  <path d="M 100.0 220.0 L 368.8 282.1
           A 116.6 39.6 78.0 0 0 320.3 54.0 Z"
        fill="url(#exCone)"/>

  <!-- 锥底所在圆：虚线给出三维形状 -->
  <ellipse cx="344.5" cy="168.0" rx="116.6" ry="39.6"
           transform="rotate(78.0 344.5 168.0)"
           fill="none" stroke="#fb7185" stroke-width="1.3" stroke-dasharray="6 4" opacity="0.75"/>

  <!-- 锥的两条母线 = 允许方向的边界 -->
  <line x1="100.0" y1="220.0" x2="368.8" y2="282.1"
        stroke="#f43f5e" stroke-width="1.7" stroke-dasharray="8 5" opacity="0.8"/>
  <line x1="100.0" y1="220.0" x2="320.3" y2="54.0"
        stroke="#f43f5e" stroke-width="1.7" stroke-dasharray="8 5" opacity="0.8"/>

  <!-- 锥体本身的名字，直接标在锥内 -->
  <text x="255" y="132" font-size="13.5" font-weight="700" fill="#be123c"
        stroke="#ffffff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">禁止锥</text>

  <!-- ==================== 天体方向轴与天体 K ==================== -->
  <line x1="100.0" y1="220.0" x2="495.2" y2="136.0"
        stroke="#7c3aed" stroke-width="1.9" stroke-dasharray="9 5" marker-end="url(#exArwAxis)"/>
  <circle cx="520.6" cy="130.6" r="20.0" fill="url(#exBody)" stroke="#64748b" stroke-width="1.3"/>
  <text x="552.6" y="128.6" font-size="13.5" font-weight="700" fill="#475569">天体 K</text>
  <text x="552.6" y="145.6" font-size="11" fill="#94a3b8">天体方向</text>

  <!-- ==================== 两条访问视线 ==================== -->
  <!-- 满足：落在锥外 -->
  <line x1="100.0" y1="220.0" x2="402.2" y2="394.5"
        stroke="#047857" stroke-width="2.6" marker-end="url(#exArwOk)"/>
  <circle cx="411.8" cy="400.0" r="6.5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.8"/>
  <text x="411.8" y="372.0" font-size="12.5" font-weight="700" fill="#6d28d9" text-anchor="middle">关联对象 B</text>

  <!-- 不满足：落在锥内 -->
  <line x1="100.0" y1="220.0" x2="668.7" y2="239.9"
        stroke="#dc2626" stroke-width="2.6" marker-end="url(#exArwBad)"/>
  <circle cx="679.6" cy="240.2" r="6.5" fill="#7c3aed" stroke="#ffffff" stroke-width="1.8"/>
  <text x="679.6" y="220.2" font-size="12.5" font-weight="700" fill="#6d28d9" text-anchor="middle">关联对象 B′</text>

  <!-- ==================== 角度弧 ==================== -->
  <!-- α_min：轴 → 锥的母线 -->
  <path d="M 192.9 200.2 A 95 95 0 0 0 175.9 162.8"
        fill="none" stroke="#e11d48" stroke-width="2.2"/>
  <text x="222" y="172" font-size="13" font-weight="700" fill="#be123c">α_min</text>

  <!-- α₂：轴 → 不满足视线 -->
  <path d="M 325.0 172.2 A 230 230 0 0 1 329.9 228.0"
        fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="352" y="192" font-size="13" font-weight="700" fill="#dc2626">α₂</text>

  <!-- α₁：轴 → 满足视线 -->
  <path d="M 256.5 186.7 A 160 160 0 0 1 238.6 300.0"
        fill="none" stroke="#047857" stroke-width="2"/>
  <text x="286" y="258" font-size="13" font-weight="700" fill="#047857">α₁</text>

  <!-- ==================== 分析对象 A ==================== -->
  <circle cx="100.0" cy="220.0" r="5" fill="#0891b2" stroke="#ffffff" stroke-width="1.6"/>
  <text x="90.0" y="208.0" font-size="13" font-weight="700" fill="#0e7490" text-anchor="end">分析对象 A</text>
  <text x="90.0" y="225.0" font-size="11" fill="#94a3b8" text-anchor="end">锥的顶点</text>

  <!-- ==================== 结果标签 ==================== -->
  <!-- 不满足 -->
  <line x1="560" y1="258" x2="560" y2="236" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
  <rect x="452" y="262" width="196" height="34" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="466" y="284" font-size="13.5" font-weight="700" fill="#b91c1c">α₂ = 14° &lt; 25° → 不满足</text>

  <!-- 满足 -->
  <line x1="426" y1="400" x2="452" y2="400" stroke="#047857" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
  <rect x="452" y="383" width="196" height="34" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="466" y="405" font-size="13.5" font-weight="700" fill="#065f46">α₁ = 42° ≥ 25° → 满足</text>

  <!-- ==================== 判定规则 ==================== -->
  <rect x="628" y="30" width="180" height="112" rx="10" fill="#ffffff" fill-opacity="0.78" stroke="#e2e8f0" stroke-width="1"/>
  <text x="646" y="56" font-size="13.5" font-weight="700" fill="#0f172a">判定规则</text>
  <text x="646" y="86" font-size="12.5" font-weight="700" fill="#047857">α ≥ α_min → 满足</text>
  <text x="646" y="112" font-size="12.5" font-weight="700" fill="#dc2626">α &lt; α_min → 不满足</text>
  <text x="646" y="132" font-size="11" fill="#94a3b8">α_min 为禁止锥半角</text>

  <!-- ==================== 脚注 ==================== -->
  <line x1="12" y1="442" x2="808" y2="442" stroke="#e2e8f0" stroke-width="1"/>
  <text x="24" y="464" font-size="12.5" fill="#64748b">天体 K 可为太阳、月球或按记录指定的其他天体；可按天体逐条建立记录，各自设置阈值。</text>
</svg>
